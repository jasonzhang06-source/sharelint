name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy

  tests:
    name: ${{ matrix.os-name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: Ubuntu
            python-version: "3.11"
          - os: ubuntu-latest
            os-name: Ubuntu
            python-version: "3.12"
          - os: ubuntu-latest
            os-name: Ubuntu
            python-version: "3.13"
          - os: ubuntu-latest
            os-name: Ubuntu
            python-version: "3.14"
          - os: windows-latest
            os-name: Windows
            python-version: "3.11"
          - os: windows-latest
            os-name: Windows
            python-version: "3.14"
          - os: macos-latest
            os-name: macOS
            python-version: "3.11"
          - os: macos-latest
            os-name: macOS
            python-version: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run unittest contract
        run: python -m unittest discover -s tests -v
      - name: Run pytest suite with coverage
        if: runner.os == 'Linux'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -p pytest_cov.plugin --cov=sharelint --cov-branch -q
      - name: Run portable pytest suite
        if: runner.os != 'Linux'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q
      - name: Smoke-test installed commands
        run: |
          sharelint --version
          sharelint rules
          python -c "import sharelint; print(sharelint.__version__)"

  wheel:
    name: Wheel / ${{ matrix.os-name }}
    needs: [quality, tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: Ubuntu
          - os: windows-latest
            os-name: Windows
          - os: macos-latest
            os-name: macOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distribution
        run: python -m pip install --upgrade pip build && python -m build
      - name: Install wheel
        run: python -c "import pathlib, subprocess, sys; wheels=list(pathlib.Path('dist').glob('*.whl')); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', str(wheels[0])])"
      - name: Smoke-test installed commands
        run: |
          sharelint --version
          sharelint rules
          python -c "import sharelint; print(sharelint.__version__)"
      - name: Upload distributions
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
