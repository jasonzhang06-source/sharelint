[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sharelint"
dynamic = ["version"]
description = "Local, fail-closed privacy preflight for files, folders, and nested archives."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "privacy",
  "security",
  "metadata",
  "office",
  "pdf",
  "pii",
  "secrets",
  "data-loss-prevention",
  "document-security",
  "local-first",
  "pii-detection",
  "secret-scanning",
  "cli",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
standalone = [
  "altgraph==0.17.5",
  "macholib==1.16.4; sys_platform == 'darwin'",
  "packaging==26.3",
  "pefile==2024.8.26; sys_platform == 'win32'",
  "pyinstaller==6.22.2",
  "pyinstaller-hooks-contrib==2026.6",
  "pywin32-ctypes==0.2.3; sys_platform == 'win32'",
  "setuptools==84.0.0",
]

[project.scripts]
sharelint = "sharelint.cli:main"

[project.urls]
Homepage = "https://github.com/jasonzhang06-source/sharelint"
Documentation = "https://github.com/jasonzhang06-source/sharelint#readme"
Source = "https://github.com/jasonzhang06-source/sharelint"
Issues = "https://github.com/jasonzhang06-source/sharelint/issues"
Changelog = "https://github.com/jasonzhang06-source/sharelint/blob/main/CHANGELOG.md"
Security = "https://github.com/jasonzhang06-source/sharelint/security/policy"
Support = "https://github.com/jasonzhang06-source/sharelint/blob/main/SUPPORT.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sharelint = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "sharelint._version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sharelint"]

[tool.coverage.run]
branch = true
source = ["sharelint"]

[tool.coverage.report]
fail_under = 75
show_missing = true
