<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="-40 -60 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ShareLint local privacy preflight</title>
  <desc id="desc">A ShareLint shield checks nested files locally, hides matched evidence, and allows packaging only after the policy gate passes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.56" stop-color="#0b1d2d"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38f2c2"/>
      <stop offset="1" stop-color="#54a9ff"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3de6b5" stop-opacity=".9"/>
      <stop offset="1" stop-color="#67b7ff" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8cb8d7" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect x="-40" y="-60" width="1280" height="640" fill="#07111f"/>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)"/>
  <circle cx="103" cy="83" r="116" fill="#2be3bd" opacity=".08" filter="url(#glow)"/>
  <circle cx="1080" cy="435" r="160" fill="#368dff" opacity=".08" filter="url(#glow)"/>

  <g transform="translate(78 73)">
    <path d="M72 3 137 26v59c0 47-27 79-65 96C34 164 7 132 7 85V26Z" fill="#0b2231" stroke="url(#brand)" stroke-width="4"/>
    <path d="M72 29v117c26-14 41-35 41-64V44Z" fill="#2ee6bc" opacity=".10"/>
    <path d="m43 87 20 20 39-45" fill="none" stroke="url(#brand)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="72" cy="87" r="55" fill="none" stroke="#bbffe9" stroke-opacity=".12"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="265" y="118" fill="#f1f8ff" font-size="62" font-weight="740" letter-spacing="-1.5">ShareLint</text>
    <text x="267" y="160" fill="#94abc0" font-size="21" letter-spacing=".3">Scan before you share.</text>

    <g transform="translate(79 293)">
      <rect width="1042" height="153" rx="15" fill="#050b13" stroke="#263c50"/>
      <rect width="1042" height="36" rx="15" fill="#101c28"/>
      <path d="M0 36h1042" stroke="#263c50"/>
      <circle cx="22" cy="18" r="5" fill="#ff6b77"/>
      <circle cx="40" cy="18" r="5" fill="#ffcc66"/>
      <circle cx="58" cy="18" r="5" fill="#3de6b5"/>
      <text x="82" y="23" fill="#6f879d" font-size="12">local · zero upload · evidence hidden</text>

      <text x="22" y="68" fill="#8ba2b7" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">$ sharelint scan client-handoff.zip</text>
      <text x="22" y="98" fill="#ffcc66" font-size="15" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">INCOMPLETE</text>
      <text x="130" y="98" fill="#b9c9d7" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">5 blockers · 13 measured surfaces · 1 explicit coverage gap</text>
      <text x="22" y="128" fill="#56e2bb" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">zip → deck.pptx → embedded.xlsx → hidden sheet</text>
      <text x="611" y="128" fill="#75baff" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">matched value never printed</text>
    </g>

    <g transform="translate(704 72)">
      <rect x="0" y="0" width="130" height="37" rx="18.5" fill="#122b2a" stroke="#286e60"/>
      <circle cx="20" cy="18.5" r="5" fill="#3de6b5"/>
      <text x="34" y="24" fill="#baffeb" font-size="13" font-weight="600">LOCAL ONLY</text>
      <rect x="143" y="0" width="105" height="37" rx="18.5" fill="#17273a" stroke="#315982"/>
      <text x="165" y="24" fill="#b9dcff" font-size="13" font-weight="600">ALPHA 0.1</text>
    </g>

    <g transform="translate(790 151)">
      <path d="M0 30h52" stroke="#405b70" stroke-width="2" stroke-dasharray="4 6"/>
      <rect x="52" y="3" width="87" height="54" rx="9" fill="#102334" stroke="#35536a"/>
      <path d="M70 19h39M70 29h51M70 39h28" stroke="#7290a7" stroke-width="3" stroke-linecap="round"/>
      <path d="M139 30h47" stroke="url(#gate)" stroke-width="3"/>
      <path d="m177 22 10 8-10 8" fill="none" stroke="#55d9ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="187" y="0" width="74" height="60" rx="10" fill="#0f2c29" stroke="#35a789"/>
      <path d="M207 19h34v25h-34zM214 13h20M214 49h20" fill="none" stroke="#56e2bb" stroke-width="2"/>
      <text x="55" y="79" fill="#7890a4" font-size="12">inspect</text>
      <text x="204" y="79" fill="#7bdabe" font-size="12">pack</text>
    </g>
  </g>
</svg>
